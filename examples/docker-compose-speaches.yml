# Docker Compose with Speaches (Local TTS/STT)
#
# This setup includes Speaches for free, private speech processing:
# - Text-to-Speech (TTS): Generate podcast audio locally
# - Speech-to-Text (STT): Transcribe audio/video content locally
#
# Why Speaches?
# - Free: No per-minute/per-character costs
# - Private: Audio never leaves your machine
# - Offline: Works without internet
# - OpenAI-compatible: Drop-in replacement for OpenAI TTS/STT
#
# Security model (same as the hardened docker-compose.yml in the repo root):
#   - every published port listens on 127.0.0.1 only;
#   - SurrealDB has no published port (reachable only inside Docker);
#   - all secrets come from .env and Compose stops if one is missing;
#   - the image is built from this repository, not pulled from upstream.
#
# Upgrading from an earlier version of this example: SurrealDB keeps the
# root user it was first started with. If your ./surreal_data was created
# with root/root, set SURREAL_ROOT_USER=root and SURREAL_ROOT_PASSWORD=root
# in .env to start, then change that password inside SurrealDB.
# Earlier versions ran the upstream image with ./notebook_data; this one
# uses the named volume notebook_data, so that folder is not reused.
#
# Usage:
#   1. Copy this file to the repository root as docker-compose.yml
#   2. Copy .env.example to .env and replace every CHANGE_ME value with a
#      long random string (for example: openssl rand -base64 32).
#      The API refuses to start with template or weak values.
#   3. Run: docker compose up -d --build
#   4. Download models (see instructions below)
#   5. Configure in UI: Settings → API Keys → Add OpenAI-Compatible
#
# Full documentation:
# - TTS setup: https://github.com/lfnovo/open-notebook/blob/main/docs/5-CONFIGURATION/local-tts.md
# - STT setup: https://github.com/lfnovo/open-notebook/blob/main/docs/5-CONFIGURATION/local-stt.md

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command: >-
      start
      --log warn
      --user ${SURREAL_ROOT_USER:?Set SURREAL_ROOT_USER in .env}
      --pass ${SURREAL_ROOT_PASSWORD:?Set SURREAL_ROOT_PASSWORD in .env}
      --bind 0.0.0.0:8000
      rocksdb:/mydata/mydatabase.db
    # No published ports: reachable only as surrealdb:8000 inside Docker.
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=false
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    ports:
      - "127.0.0.1:8969:8000"  # only for testing from this computer
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped
    # For GPU acceleration, use: ghcr.io/speaches-ai/speaches:latest-cuda
    # and add GPU device mapping (see docs/5-CONFIGURATION/local-tts.md)

  open_notebook:
    build:
      context: .
      dockerfile: Dockerfile
    image: opennotebook-archival:local
    pull_policy: never
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8502}:8502"
      - "127.0.0.1:${API_PORT:-5055}:5055"
    env_file:
      - .env
    environment:
      # Required secrets (read from .env; Compose stops if one is missing)
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:?Set OPEN_NOTEBOOK_PASSWORD in .env}
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Set OPEN_NOTEBOOK_ENCRYPTION_KEY in .env}

      # Database connection (internal Docker network)
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_ROOT_USER}
      - SURREAL_PASSWORD=${SURREAL_ROOT_PASSWORD}
      - SURREAL_NAMESPACE=${SURREAL_NAMESPACE:-open_notebook}
      - SURREAL_DATABASE=${SURREAL_DATABASE:-open_notebook}
    volumes:
      - notebook_data:/app/data  # named volume: the image runs as a non-root user
    depends_on:
      - surrealdb
      - speaches
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  notebook_data:
  hf-hub-cache:

# ==========================================
# AFTER STARTING: Download Speech Models
# ==========================================
#
# For TTS (Text-to-Speech):
#   docker compose exec speaches uv tool run speaches-cli model download speaches-ai/Kokoro-82M-v1.0-ONNX
#
# For STT (Speech-to-Text):
#   docker compose exec speaches uv tool run speaches-cli model download Systran/faster-whisper-small
#
# ==========================================
# CONFIGURATION IN OPEN NOTEBOOK
# ==========================================
#
# 1. Go to Settings → API Keys
# 2. Click "Add Credential" → Select "OpenAI-Compatible"
# 3. Configure:
#    - Name: "Local Speaches"
#    - Base URL for TTS: http://speaches:8000/v1  (service name inside Docker)
#    - Base URL for STT: (same as TTS)
# 4. Click Save → Test Connection
#
# 5. Go to Settings → Models
# 6. Add TTS Model:
#    - Provider: openai_compatible
#    - Model Name: speaches-ai/Kokoro-82M-v1.0-ONNX
#    - Display Name: Local TTS
#
# 7. Add STT Model:
#    - Provider: openai_compatible
#    - Model Name: Systran/faster-whisper-small
#    - Display Name: Local Whisper
#
# ==========================================
# TESTING
# ==========================================
#
# Test TTS:
#   curl "http://localhost:8969/v1/audio/speech" -s \
#     -H "Content-Type: application/json" \
#     --output test.mp3 \
#     --data '{"input": "Hello, local TTS works!", "model": "speaches-ai/Kokoro-82M-v1.0-ONNX", "voice": "af_bella"}'
#
# Test STT:
#   curl "http://localhost:8969/v1/audio/transcriptions" \
#     -F "file=@test.mp3" \
#     -F "model=Systran/faster-whisper-small"
#
# Available voices: af_bella, af_sarah, am_adam, am_michael, bf_emma, bm_george
# Available models: See docs/5-CONFIGURATION/local-stt.md for model sizes
