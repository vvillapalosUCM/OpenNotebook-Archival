# Docker Compose - 100% Local AI Setup
#
# This is the complete privacy-focused setup with NO external APIs needed:
# - Ollama: Local LLM and embeddings (mistral, llama, nomic-embed, etc.)
# - Speaches: Local TTS (text-to-speech) and STT (speech-to-text)
# - Open Notebook: Your research assistant
# - SurrealDB: Local database
#
# Perfect for:
# - Complete privacy (nothing leaves your machine)
# - Offline work
# - No API costs
# - Air-gapped environments
# - Testing and development
#
# Security model (same as the hardened docker-compose.yml in the repo root):
#   - every published port listens on 127.0.0.1 only;
#   - SurrealDB has no published port (reachable only inside Docker);
#   - all secrets come from .env and Compose stops if one is missing;
#   - the image is built from this repository, not pulled from upstream.
#
# Upgrading from an earlier version of this example: SurrealDB keeps the
# root user it was first started with. If your ./surreal_data was created
# with root/root, set SURREAL_ROOT_USER=root and SURREAL_ROOT_PASSWORD=root
# in .env to start, then change that password inside SurrealDB.
# Earlier versions ran the upstream image with ./notebook_data; this one
# uses the named volume notebook_data, so that folder is not reused.
#
# Usage:
#   1. Copy this file to the repository root as docker-compose.yml
#   2. Copy .env.example to .env and replace every CHANGE_ME value with a
#      long random string (for example: openssl rand -base64 32).
#      The API refuses to start with template or weak values.
#   3. Run: docker compose up -d --build
#   4. Pull models (see instructions below)
#   5. Configure providers in UI
#
# Full documentation:
# - Ollama setup: https://github.com/lfnovo/open-notebook/blob/main/examples/README.md
# - TTS setup: https://github.com/lfnovo/open-notebook/blob/main/docs/5-CONFIGURATION/local-tts.md
# - STT setup: https://github.com/lfnovo/open-notebook/blob/main/docs/5-CONFIGURATION/local-stt.md

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    user: root
    command: >-
      start
      --log warn
      --user ${SURREAL_ROOT_USER:?Set SURREAL_ROOT_USER in .env}
      --pass ${SURREAL_ROOT_PASSWORD:?Set SURREAL_ROOT_PASSWORD in .env}
      --bind 0.0.0.0:8000
      rocksdb:/mydata/mydatabase.db
    # No published ports: reachable only as surrealdb:8000 inside Docker.
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=false
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: always
    pull_policy: always
    # For GPU acceleration (NVIDIA), add:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    ports:
      - "127.0.0.1:8969:8000"  # only for testing from this computer
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped
    # For GPU acceleration, use: ghcr.io/speaches-ai/speaches:latest-cuda
    # and add GPU device mapping (see docs)

  open_notebook:
    build:
      context: .
      dockerfile: Dockerfile
    image: opennotebook-archival:local
    pull_policy: never
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8502}:8502"
      - "127.0.0.1:${API_PORT:-5055}:5055"
    env_file:
      - .env
    environment:
      # Required secrets (read from .env; Compose stops if one is missing)
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:?Set OPEN_NOTEBOOK_PASSWORD in .env}
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Set OPEN_NOTEBOOK_ENCRYPTION_KEY in .env}

      # Database connection (internal Docker network)
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_ROOT_USER}
      - SURREAL_PASSWORD=${SURREAL_ROOT_PASSWORD}
      - SURREAL_NAMESPACE=${SURREAL_NAMESPACE:-open_notebook}
      - SURREAL_DATABASE=${SURREAL_DATABASE:-open_notebook}

      # Ollama connection (optional, can also configure via UI)
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - notebook_data:/app/data  # named volume: the image runs as a non-root user
    depends_on:
      - surrealdb
      - ollama
      - speaches
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  notebook_data:
  ollama_models:
  hf-hub-cache:

# ==========================================
# AFTER STARTING: Download Models
# ==========================================
#
# Ollama Models (LLM):
#   docker compose exec ollama ollama pull mistral
#   docker compose exec ollama ollama pull llama3.1
#   docker compose exec ollama ollama pull qwen2.5
#
# Ollama Models (Embeddings):
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose exec ollama ollama pull mxbai-embed-large
#
# Speaches (TTS):
#   docker compose exec speaches uv tool run speaches-cli model download speaches-ai/Kokoro-82M-v1.0-ONNX
#
# Speaches (STT):
#   docker compose exec speaches uv tool run speaches-cli model download Systran/faster-whisper-small
#
# ==========================================
# CONFIGURATION IN OPEN NOTEBOOK
# ==========================================
#
# 1. Configure Ollama:
#    - Go to Settings → API Keys
#    - Add Credential → Select "Ollama"
#    - Base URL: http://ollama:11434
#    - Save → Test Connection → Discover Models → Register Models
#
# 2. Configure Speaches (TTS/STT):
#    - Go to Settings → API Keys
#    - Add Credential → Select "OpenAI-Compatible"
#    - Name: "Local Speaches"
#    - Base URL for TTS: http://speaches:8000/v1  (service name inside Docker)
#    - Base URL for STT: (same as TTS)
#    - Save → Test Connection
#
# 3. Discover Speech Models:
#    - In the Speaches credential you just created, click Discover Models
#    - Select and register the models you need (e.g. TTS and STT)
#    - If models aren't discovered automatically, add them manually:
#      * TTS: speaches-ai/Kokoro-82M-v1.0-ONNX
#      * STT: Systran/faster-whisper-small
#
# ==========================================
# RECOMMENDED MODELS
# ==========================================
#
# For LLM (choose based on your hardware):
# - Fast: mistral (7B), qwen2.5 (7B)
# - Balanced: llama3.1 (8B)
# - Best quality: qwen2.5 (14B+), llama3.1 (70B) - requires powerful GPU
#
# For Embeddings:
# - nomic-embed-text (recommended, 137M params)
# - mxbai-embed-large (334M params, better quality)
#
# For TTS:
# - speaches-ai/Kokoro-82M-v1.0-ONNX (good quality, fast)
#
# For STT (Whisper):
# - faster-whisper-small (balanced, ~500MB)
# - faster-whisper-base (faster, less accurate)
# - faster-whisper-large-v3 (best quality, slower, ~3GB)
#
# ==========================================
# HARDWARE REQUIREMENTS
# ==========================================
#
# Minimum (CPU only):
# - 8 GB RAM
# - 20 GB disk space
# - 4 CPU cores
#
# Recommended (with GPU):
# - 16+ GB RAM
# - 8+ GB VRAM (NVIDIA GPU)
# - 50 GB disk space
# - 8+ CPU cores
#
# ==========================================
# COST COMPARISON
# ==========================================
#
# Local (this setup):
# - Cost: $0 (after hardware)
# - Privacy: 100% private
# - Speed: Depends on hardware
#
# Cloud (OpenAI + ElevenLabs):
# - LLM: ~$0.01-0.10 per 1K tokens
# - Embeddings: ~$0.0001 per 1K tokens
# - TTS: ~$0.015 per minute
# - STT: ~$0.006 per minute
# - Privacy: Data sent to providers
# - Speed: Usually faster
